name: EveningsBroadcaster
options:
  bundleIdPrefix: co.evenings
  deploymentTarget:
    iOS: "16.0"
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    from: "2.0.0"
targets:
  EveningsBroadcaster:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Evenings
        # HTTPS-only; exempt from export compliance so uploads skip the question.
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Evenings uses the microphone to broadcast live audio to your station.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - et-book-roman-line-figures.ttf
          - et-book-semi-bold-old-style-figures.ttf
          - et-book-bold-line-figures.ttf
          - OCRAEXT.TTF
          - ABCSocial-Regular.ttf
          - ABCSocial-Medium.ttf
          - ABCSocial-Bold.ttf
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        DEVELOPMENT_TEAM: 3BBF83PB2F
        CODE_SIGN_STYLE: Automatic
        # User-visible product name; the target keeps its longer internal name
        # so the bundle ID stays co.evenings.EveningsBroadcaster.
        PRODUCT_NAME: Evenings
