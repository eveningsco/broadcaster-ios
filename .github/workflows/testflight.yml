# Archives the app on a macOS runner and uploads it to TestFlight.
#
# Manual only: run it from the Actions tab ("TestFlight" → "Run workflow",
# pick a branch) or with `gh workflow run testflight.yml --ref <branch>`.
# macOS minutes bill at 10x Linux on private repos, so nothing uploads on push.
#
# Required repo secrets (App Store Connect → Users and Access → Integrations →
# App Store Connect API, key with the Admin role so Xcode can manage the
# distribution certificate and profile via cloud signing):
#   ASC_KEY_ID      Key ID
#   ASC_ISSUER_ID   Issuer ID
#   ASC_KEY_P8      Full contents of the downloaded AuthKey_XXXX.p8 file
name: TestFlight

on:
  workflow_dispatch:

# Starting another upload of the same branch supersedes an in-flight one.
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # TestFlight requires each upload's build number to be higher than the
      # last; offset past the builds uploaded by hand (project.yml is at 2).
      - name: Set build number
        run: echo "BUILD_NUMBER=$((100 + ${{ github.run_number }})).${{ github.run_attempt }}" >> "$GITHUB_ENV"

      # HaishinKit 2.2+ needs Xcode 26; the macos-15 image defaults to 16.4.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_P8 secret is not set; see the header of testflight.yml" >&2
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project EveningsBroadcaster.xcodeproj \
            -scheme EveningsBroadcaster \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Evenings.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>3BBF83PB2F</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Evenings.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          echo "Uploaded build $BUILD_NUMBER from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
