# SOURCE OF TRUTH for .github/workflows/simulator-screenshots.yml.
#
# The forum agent's GitHub token lacks the `workflow` scope, so it cannot push
# anything under .github/workflows/. It edits this copy instead; a human syncs
# it when it changes (should be rare — all the logic lives in
# scripts/ci/simulator-screenshots-job.sh, which anyone can edit):
#
#   cp scripts/ci/simulator-screenshots.yml .github/workflows/
#   git commit -am "Sync the Simulator Screenshots workflow" && git push
#
# Builds the app for the iOS Simulator on a macOS runner and captures each
# screenshot-mode scene (Sources/Debug/ScreenshotMode.swift) as a PNG
# artifact; `-demo` scenes are recorded (animated PNG + .mov). Manual only:
# macOS minutes bill at 10x Linux on private repos.
#
#   scripts/ci-screenshots.py            # trigger, wait, download (needs GH_TOKEN)
#   gh workflow run simulator-screenshots.yml --ref <branch>
name: Simulator Screenshots
# scripts/ci-screenshots.py reads this title back to know which scenes a past
# run covered (for reuse and for picking scenes automatically). Keep the format.
run-name: "Screenshots: ${{ inputs.scenes }} · ${{ inputs.appearance }} · ${{ inputs.device }}"

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Scenes to capture (space-separated: login signup library explore account edit track stage live; edit-demo and track-demo record videos)"
        default: "login signup library explore account edit track stage live"
      device:
        description: "Simulator device name"
        default: "iPhone 16 Pro"
      appearance:
        description: "System appearance (the app forces dark; light renders identically)"
        type: choice
        options: [light, dark, both]
        default: dark

# One run per branch at a time. A run dispatched while another is in flight
# waits; dispatching again while one is waiting replaces the waiting one, so a
# burst of dispatches collapses into at most one follow-up run. (The trigger
# script already avoids this; this is the backstop for `gh workflow run`.)
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same pick as the job script's default; part of the cache key so a new
      # Xcode on the runner image starts a fresh cache instead of a stale one.
      - name: Pick Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          echo "path=$XCODE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${XCODE:-default}" .app)" >> "$GITHUB_OUTPUT"

      # Restores the whole DerivedData (resolved Swift packages *and* compiled
      # products), so HaishinKit isn't recompiled every run. The app's own
      # sources still rebuild (checkout gives them fresh mtimes), but that's
      # the small part. Exact hit when project.yml and Sources/ are unchanged
      # (re-runs for other scenes); otherwise the newest cache from this
      # branch or main is the warm start.
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/DerivedData
            !build/DerivedData/Logs
            !build/DerivedData/Index.noindex
          key: deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.name }}-${{ hashFiles('project.yml') }}-${{ hashFiles('Sources/**') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.name }}-${{ hashFiles('project.yml') }}-
            deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.name }}-

      - name: Build and capture
        env:
          XCODE: ${{ steps.xcode.outputs.path }}
          DEVICE: ${{ inputs.device }}
          SCENES: ${{ inputs.scenes }}
          APPEARANCE: ${{ inputs.appearance }}
          OUT: screenshots
        run: scripts/ci/simulator-screenshots-job.sh

      # Saved as soon as the build succeeds, even if capturing fails, and
      # skipped on an exact hit (the cache already holds this build).
      - name: Save build cache
        if: always() && steps.build-cache.outputs.cache-hit != 'true' && hashFiles('build/.build-succeeded') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/DerivedData
            !build/DerivedData/Logs
            !build/DerivedData/Index.noindex
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: |
            screenshots/*.png
            screenshots/*.mov
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
